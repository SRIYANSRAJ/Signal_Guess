<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Signal Lock — Number Tracking Protocol</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --cold:#38bdf8;
    --amber:#fbbf24;
    --hot:#fb7185;
    --lock:#34d399;
    --danger:#f87171;
    --radius-lg:20px;
    --radius-md:14px;
    --radius-sm:9px;
    --ease:cubic-bezier(.16,1,.3,1);
  }
  html[data-theme="dark"]{
    --bg:#080d18;
    --bg-grid: rgba(148,178,255,0.045);
    --surface:#111a2c;
    --surface-2:#182338;
    --surface-3:#1f2c46;
    --border: rgba(148,178,255,0.14);
    --border-strong: rgba(148,178,255,0.28);
    --text:#e7ecf7;
    --text-dim:#aab4cc;
    --muted:#6d7a99;
    --accent:#5eead4;
    --accent-dim: rgba(94,234,212,0.14);
    --shadow: 0 20px 60px -20px rgba(0,0,0,0.6);
  }
  html[data-theme="light"]{
    --bg:#eef1f7;
    --bg-grid: rgba(30,45,90,0.05);
    --surface:#ffffff;
    --surface-2:#f4f6fb;
    --surface-3:#e9edf6;
    --border: rgba(30,45,90,0.1);
    --border-strong: rgba(30,45,90,0.2);
    --text:#161d2e;
    --text-dim:#4b5570;
    --muted:#7b859e;
    --accent:#0f9488;
    --accent-dim: rgba(15,148,136,0.1);
    --shadow: 0 20px 50px -25px rgba(30,45,90,0.35);
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Manrope',system-ui,sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    transition:background .5s var(--ease), color .5s var(--ease);
    background-image:
      radial-gradient(var(--bg-grid) 1px, transparent 1px);
    background-size: 28px 28px;
    overflow-x:hidden;
  }

  .wrap{
    flex:1;
    width:100%;
    max-width:640px;
    margin:0 auto;
    padding:32px 20px 20px;
    display:flex;
    flex-direction:column;
    gap:22px;
  }

  /* ---------- HEADER ---------- */
  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:14px;
  }
  .radar{
    position:relative;
    width:38px;height:38px;
    border-radius:50%;
    border:2px solid var(--border-strong);
    background:var(--surface-2);
    overflow:hidden;
    flex-shrink:0;
  }
  .radar::before{
    content:"";
    position:absolute;
    inset:0;
    background:conic-gradient(from 0deg, transparent 0deg, var(--accent) 18deg, transparent 70deg);
    animation:sweep 2.4s linear infinite;
    opacity:.85;
  }
  .radar::after{
    content:"";
    position:absolute;
    inset:0;
    border-radius:50%;
    box-shadow: inset 0 0 0 1px var(--border), inset 0 0 8px rgba(0,0,0,.15);
  }
  @keyframes sweep{ to{ transform:rotate(360deg); } }
  .brand-text .eyebrow{
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--muted);
    font-weight:600;
  }
  .brand-text h1{
    margin:2px 0 0;
    font-family:'JetBrains Mono',monospace;
    font-size:20px;
    font-weight:700;
    letter-spacing:.02em;
  }

  .theme-toggle{
    position:relative;
    width:52px;height:30px;
    border-radius:30px;
    border:1px solid var(--border-strong);
    background:var(--surface-2);
    cursor:pointer;
    display:flex;
    align-items:center;
    padding:3px;
    transition:background .3s var(--ease);
  }
  .theme-toggle .knob{
    width:22px;height:22px;
    border-radius:50%;
    background:var(--accent);
    display:flex;align-items:center;justify-content:center;
    font-size:12px;
    transition:transform .4s var(--ease);
    transform:translateX(0);
  }
  html[data-theme="dark"] .theme-toggle .knob{ transform:translateX(22px); }

  /* ---------- CARD ---------- */
  .panel{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius-lg);
    box-shadow:var(--shadow);
    padding:26px;
    transition:background .5s var(--ease), border-color .5s var(--ease);
  }

  .section-label{
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--muted);
    font-weight:700;
    margin-bottom:12px;
  }

  /* difficulty cards */
  .diff-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
  }
  .diff-card{
    position:relative;
    background:var(--surface-2);
    border:1px solid var(--border);
    border-radius:var(--radius-md);
    padding:14px 14px 12px;
    cursor:pointer;
    text-align:left;
    color:var(--text);
    transition:transform .2s var(--ease), border-color .2s var(--ease), background .2s var(--ease);
    font-family:inherit;
  }
  .diff-card:hover{ transform:translateY(-2px); border-color:var(--border-strong); }
  .diff-card.active{
    border-color:var(--accent);
    background:var(--accent-dim);
  }
  .diff-card .name{ font-weight:800; font-size:14px; }
  .diff-card .range{
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    color:var(--muted);
    margin-top:3px;
  }
  .diff-card.active .range{ color:var(--accent); }

  /* custom toggle row */
  .custom-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-top:16px;
    padding-top:16px;
    border-top:1px dashed var(--border);
  }
  .custom-row .label{
    font-size:13.5px;
    font-weight:700;
  }
  .custom-row .sub{
    font-size:12px;
    color:var(--muted);
    margin-top:2px;
  }
  .switch{
    position:relative;
    width:42px;height:24px;
    border-radius:24px;
    background:var(--surface-3);
    border:1px solid var(--border-strong);
    cursor:pointer;
    flex-shrink:0;
  }
  .switch .dot{
    position:absolute;
    top:2px;left:2px;
    width:18px;height:18px;
    border-radius:50%;
    background:var(--muted);
    transition:transform .25s var(--ease), background .25s var(--ease);
  }
  .switch.on{ background:var(--accent-dim); border-color:var(--accent); }
  .switch.on .dot{ transform:translateX(18px); background:var(--accent); }

  .custom-fields{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:14px;
    max-height:0;
    opacity:0;
    overflow:hidden;
    transition:max-height .35s var(--ease), opacity .3s var(--ease), margin .35s var(--ease);
  }
  .custom-fields.open{
    max-height:100px;
    opacity:1;
  }
  .field label{
    display:block;
    font-size:11px;
    color:var(--muted);
    margin-bottom:6px;
    text-transform:uppercase;
    letter-spacing:.08em;
    font-weight:700;
  }
  .field input{
    width:100%;
    padding:10px 12px;
    border-radius:var(--radius-sm);
    border:1px solid var(--border-strong);
    background:var(--surface-2);
    color:var(--text);
    font-family:'JetBrains Mono',monospace;
    font-size:15px;
    transition:border-color .2s;
  }
  .field input:focus{ outline:none; border-color:var(--accent); }

  .hint-err{
    font-size:12px;
    color:var(--danger);
    margin-top:8px;
    min-height:16px;
  }

  .btn{
    appearance:none;
    border:none;
    cursor:pointer;
    font-family:'Manrope',sans-serif;
    font-weight:800;
    letter-spacing:.02em;
    transition:transform .15s var(--ease), box-shadow .2s var(--ease), background .2s var(--ease), filter .2s;
  }
  .btn:active{ transform:scale(.96); }
  .btn-primary{
    width:100%;
    margin-top:18px;
    padding:14px;
    border-radius:var(--radius-md);
    background:var(--accent);
    color:#04241f;
    font-size:14.5px;
    letter-spacing:.06em;
    text-transform:uppercase;
    box-shadow: 0 10px 30px -10px var(--accent);
  }
  html[data-theme="light"] .btn-primary{ color:#fff; }
  .btn-primary:hover{ filter:brightness(1.08); }

  /* ---------- GAME PANEL ---------- */
  #gamePanel{ display:none; }
  .game-top{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom:18px;
    font-family:'JetBrains Mono',monospace;
  }
  .game-top .range-tag{
    font-size:13px;
    color:var(--muted);
    letter-spacing:.04em;
  }
  .game-top .range-tag b{ color:var(--text); }
  .game-top .attempt-tag{
    font-size:13px;
    color:var(--accent);
    font-weight:700;
    letter-spacing:.04em;
  }

  .guess-row{
    display:flex;
    gap:10px;
  }
  .guess-row input{
    flex:1;
    padding:16px 16px;
    font-size:22px;
    font-family:'JetBrains Mono',monospace;
    font-weight:700;
    border-radius:var(--radius-md);
    border:1px solid var(--border-strong);
    background:var(--surface-2);
    color:var(--text);
    text-align:center;
    letter-spacing:.03em;
    transition:border-color .2s, box-shadow .2s;
  }
  .guess-row input:focus{
    outline:none;
    border-color:var(--accent);
    box-shadow:0 0 0 4px var(--accent-dim);
  }
  .guess-row button{
    padding:0 22px;
    border-radius:var(--radius-md);
    background:var(--surface-3);
    color:var(--text);
    font-size:13px;
    letter-spacing:.05em;
    text-transform:uppercase;
    border:1px solid var(--border-strong);
  }
  .guess-row button:hover{ background:var(--accent-dim); border-color:var(--accent); color:var(--accent); }

  .shake{ animation:shakeAnim .35s var(--ease); }
  @keyframes shakeAnim{
    0%,100%{ transform:translateX(0); }
    25%{ transform:translateX(-8px); }
    75%{ transform:translateX(8px); }
  }

  /* meter */
  .meter-wrap{ margin-top:22px; }
  .meter-labels{
    display:flex;
    justify-content:space-between;
    font-size:12px;
    color:var(--muted);
    margin-bottom:8px;
  }
  .meter-labels .status{
    font-weight:800;
    letter-spacing:.04em;
    color:var(--text);
  }
  .meter-track{
    position:relative;
    height:14px;
    border-radius:20px;
    background:var(--surface-3);
    overflow:hidden;
    border:1px solid var(--border);
  }
  .meter-fill{
    position:absolute;
    left:0;top:0;bottom:0;
    width:0%;
    border-radius:20px;
    background:var(--cold);
    transition:width .5s var(--ease), background .5s var(--ease);
  }
  .meter-fill::after{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(90deg, transparent, rgba(255,255,255,.35), transparent);
    animation:shimmer 1.6s linear infinite;
  }
  @keyframes shimmer{ 0%{transform:translateX(-100%);} 100%{transform:translateX(220%);} }

  .direction-tag{
    display:inline-flex;
    align-items:center;
    gap:6px;
    margin-top:14px;
    padding:7px 12px;
    border-radius:20px;
    font-size:12.5px;
    font-weight:700;
    background:var(--surface-2);
    border:1px solid var(--border);
    opacity:0;
    transform:translateY(-4px);
    transition:opacity .3s var(--ease), transform .3s var(--ease);
  }
  .direction-tag.show{ opacity:1; transform:translateY(0); }
  .direction-tag.low{ color:var(--cold); border-color:var(--cold); }
  .direction-tag.high{ color:var(--hot); border-color:var(--hot); }

  /* log */
  .log-wrap{ margin-top:22px; }
  .log-list{
    display:flex;
    flex-direction:column-reverse;
    gap:7px;
    max-height:190px;
    overflow-y:auto;
    padding-right:4px;
  }
  .log-list::-webkit-scrollbar{ width:6px; }
  .log-list::-webkit-scrollbar-thumb{ background:var(--border-strong); border-radius:10px; }
  .log-item{
    display:flex;
    align-items:center;
    gap:10px;
    padding:9px 12px;
    border-radius:var(--radius-sm);
    background:var(--surface-2);
    border:1px solid var(--border);
    font-family:'JetBrains Mono',monospace;
    font-size:13px;
    animation:slideIn .35s var(--ease);
  }
  @keyframes slideIn{
    from{ opacity:0; transform:translateY(8px); }
    to{ opacity:1; transform:translateY(0); }
  }
  .log-item .dot{
    width:8px;height:8px;border-radius:50%;
    flex-shrink:0;
  }
  .log-item .n{ color:var(--muted); width:34px; }
  .log-item .v{ font-weight:700; width:70px; }
  .log-item .f{ margin-left:auto; color:var(--muted); }

  /* win overlay */
  .win-box{
    display:none;
    text-align:center;
    padding:10px 4px 4px;
  }
  .win-ring{
    position:relative;
    width:110px;height:110px;
    margin:0 auto 18px;
  }
  .win-ring .num{
    position:absolute;inset:0;
    display:flex;align-items:center;justify-content:center;
    font-family:'JetBrains Mono',monospace;
    font-size:30px;font-weight:800;
    color:var(--lock);
  }
  .win-ring .ring{
    position:absolute;inset:0;
    border-radius:50%;
    border:3px solid var(--lock);
    animation:pulseRing 1.6s var(--ease) infinite;
  }
  .win-ring .ring:nth-child(2){ animation-delay:.5s; }
  @keyframes pulseRing{
    0%{ transform:scale(.75); opacity:1; }
    100%{ transform:scale(1.5); opacity:0; }
  }
  .win-box h2{
    font-family:'JetBrains Mono',monospace;
    margin:0 0 6px;
    font-size:19px;
    color:var(--lock);
    letter-spacing:.03em;
  }
  .win-box p{ color:var(--muted); margin:0 0 20px; font-size:14px; }
  .stat-row{
    display:flex;
    gap:10px;
    margin-bottom:20px;
  }
  .stat{
    flex:1;
    background:var(--surface-2);
    border:1px solid var(--border);
    border-radius:var(--radius-md);
    padding:12px 8px;
  }
  .stat .v{ font-family:'JetBrains Mono',monospace; font-size:19px; font-weight:800; }
  .stat .l{ font-size:10.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.08em; margin-top:3px; }

  /* footer */
  footer{
    text-align:center;
    padding:22px 20px 28px;
    font-size:12.5px;
    color:var(--muted);
  }
  footer .heart{ color:var(--hot); }
  footer a{ color:var(--accent); text-decoration:none; font-weight:700; }

  @media (max-width:420px){
    .diff-grid{ grid-template-columns:1fr 1fr; }
    .guess-row{ flex-direction:column; }
    .guess-row button{ padding:14px; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.001ms !important; transition-duration:0.001ms !important; }
  }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="brand">
      <div class="radar"></div>
      <div class="brand-text">
        <div class="eyebrow">Number Tracking Protocol</div>
        <h1>SIGNAL LOCK</h1>
      </div>
    </div>
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark and light mode">
      <span class="knob" id="knobIcon">☾</span>
    </button>
  </header>

  <!-- SETUP PANEL -->
  <div class="panel" id="setupPanel">
    <div class="section-label">Select difficulty</div>
    <div class="diff-grid" id="diffGrid">
      <button class="diff-card active" data-min="1" data-max="100">
        <div class="name">Easy</div>
        <div class="range">1 – 100</div>
      </button>
      <button class="diff-card" data-min="1" data-max="1000">
        <div class="name">Medium</div>
        <div class="range">1 – 1,000</div>
      </button>
      <button class="diff-card" data-min="1" data-max="10000">
        <div class="name">Hard</div>
        <div class="range">1 – 10,000</div>
      </button>
      <button class="diff-card" data-min="1" data-max="100000">
        <div class="name">Extreme</div>
        <div class="range">1 – 100,000</div>
      </button>
    </div>

    <div class="custom-row">
      <div>
        <div class="label">Custom range</div>
        <div class="sub">Choose your own start and end point</div>
      </div>
      <div class="switch" id="customSwitch"><div class="dot"></div></div>
    </div>
    <div class="custom-fields" id="customFields">
      <div class="field">
        <label for="startInput">Starting point</label>
        <input type="number" id="startInput" value="1">
      </div>
      <div class="field">
        <label for="endInput">End point</label>
        <input type="number" id="endInput" placeholder="e.g. 500">
      </div>
    </div>
    <div class="hint-err" id="customErr"></div>

    <button class="btn btn-primary" id="beginBtn">Begin Tracking</button>
  </div>

  <!-- GAME PANEL -->
  <div class="panel" id="gamePanel">
    <div class="game-top">
      <div class="range-tag">RANGE <b id="rangeText">1–100</b></div>
      <div class="attempt-tag" id="attemptText">ATTEMPT 01</div>
    </div>

    <div class="guess-row">
      <input type="number" id="guessInput" placeholder="Enter your guess" autocomplete="off">
      <button id="lockBtn">Lock In</button>
    </div>

    <div class="meter-wrap">
      <div class="meter-labels">
        <span>Signal strength</span>
        <span class="status" id="meterStatus">— — —</span>
      </div>
      <div class="meter-track">
        <div class="meter-fill" id="meterFill"></div>
      </div>
      <div class="direction-tag" id="directionTag" aria-live="polite"></div>
    </div>

    <div class="log-wrap">
      <div class="section-label">Ping log</div>
      <div class="log-list" id="logList"></div>
    </div>
  </div>

  <!-- WIN PANEL -->
  <div class="panel win-box" id="winPanel">
    <div class="win-ring">
      <div class="ring"></div>
      <div class="ring"></div>
      <div class="num" id="winNum">0</div>
    </div>
    <h2>SIGNAL LOCKED</h2>
    <p>Target acquired. Nice tracking.</p>
    <div class="stat-row">
      <div class="stat"><div class="v" id="winAttempts">0</div><div class="l">Attempts</div></div>
      <div class="stat"><div class="v" id="winRange">0</div><div class="l">Range size</div></div>
      <div class="stat"><div class="v" id="winTime">0s</div><div class="l">Time</div></div>
    </div>
    <button class="btn btn-primary" id="againBtn">Track Another Signal</button>
  </div>
</div>

<footer>
  Made by <a href="#" onclick="return false;">Sriyans Raj</a> · Signal Lock v2
</footer>

<script>
(function(){
  const root = document.documentElement;
  const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  root.setAttribute('data-theme', prefersDark ? 'dark' : 'light');

  const themeToggle = document.getElementById('themeToggle');
  const knobIcon = document.getElementById('knobIcon');
  function syncKnob(){
    knobIcon.textContent = root.getAttribute('data-theme') === 'dark' ? '☾' : '☀';
  }
  syncKnob();
  themeToggle.addEventListener('click', () => {
    const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    syncKnob();
  });

  // ---------- setup state ----------
  const diffCards = document.querySelectorAll('.diff-card');
  const customSwitch = document.getElementById('customSwitch');
  const customFields = document.getElementById('customFields');
  const startInput = document.getElementById('startInput');
  const endInput = document.getElementById('endInput');
  const customErr = document.getElementById('customErr');
  const beginBtn = document.getElementById('beginBtn');
  const diffGrid = document.getElementById('diffGrid');

  let useCustom = false;
  let selMin = 1, selMax = 100;

  diffCards.forEach(card => {
    card.addEventListener('click', () => {
      diffCards.forEach(c => c.classList.remove('active'));
      card.classList.add('active');
      selMin = parseInt(card.dataset.min, 10);
      selMax = parseInt(card.dataset.max, 10);
    });
  });

  customSwitch.addEventListener('click', () => {
    useCustom = !useCustom;
    customSwitch.classList.toggle('on', useCustom);
    customFields.classList.toggle('open', useCustom);
    diffGrid.style.opacity = useCustom ? '0.4' : '1';
    diffGrid.style.pointerEvents = useCustom ? 'none' : 'auto';
    customErr.textContent = '';
  });

  // ---------- secure-ish uniform random int ----------
  function randomInt(min, max){
    // inclusive min & max, unbiased via rejection sampling
    const range = max - min + 1;
    const maxUint32 = 0xFFFFFFFF;
    const limit = Math.floor((maxUint32 + 1) / range) * range;
    let buf = new Uint32Array(1);
    let x;
    do {
      crypto.getRandomValues(buf);
      x = buf[0];
    } while (x >= limit);
    return min + (x % range);
  }

  function ordinal(n){
    const s = ["th","st","nd","rd"];
    const v = n % 100;
    return n + (s[(v - 20) % 10] || s[v] || s[0]);
  }

  // ---------- game state ----------
  const setupPanel = document.getElementById('setupPanel');
  const gamePanel = document.getElementById('gamePanel');
  const winPanel = document.getElementById('winPanel');
  const rangeText = document.getElementById('rangeText');
  const attemptText = document.getElementById('attemptText');
  const guessInput = document.getElementById('guessInput');
  const lockBtn = document.getElementById('lockBtn');
  const meterFill = document.getElementById('meterFill');
  const meterStatus = document.getElementById('meterStatus');
  const directionTag = document.getElementById('directionTag');
  const logList = document.getElementById('logList');

  let target = 0, min = 1, max = 100, attempts = 0, startTime = 0;
  let history = [];

  function fmt(n){ return n.toLocaleString(); }

  function startGame(){
    if (useCustom){
      const s = parseInt(startInput.value, 10);
      const e = parseInt(endInput.value, 10);
      if (isNaN(s) || isNaN(e)){
        customErr.textContent = 'Enter numbers for both start and end.';
        return;
      }
      if (e <= s){
        customErr.textContent = 'End point must be greater than the starting point.';
        return;
      }
      if (e - s > 100000000){
        customErr.textContent = 'Keep the range under 100,000,000 for sane tracking.';
        return;
      }
      min = s; max = e;
    } else {
      min = selMin; max = selMax;
    }
    customErr.textContent = '';
    target = randomInt(min, max);
    attempts = 0;
    history = [];
    startTime = Date.now();
    logList.innerHTML = '';
    meterFill.style.width = '0%';
    meterStatus.textContent = '— — —';
    directionTag.className = 'direction-tag';
    directionTag.textContent = '';
    rangeText.textContent = `${fmt(min)}–${fmt(max)}`;
    attemptText.textContent = 'ATTEMPT 01';
    guessInput.value = '';
    setupPanel.style.display = 'none';
    winPanel.style.display = 'none';
    gamePanel.style.display = 'block';
    guessInput.focus();
  }

  function lerpColor(a, b, t){
    const ah = a.match(/\w\w/g).map(x=>parseInt(x,16));
    const bh = b.match(/\w\w/g).map(x=>parseInt(x,16));
    const rh = ah.map((c,i)=>Math.round(c + (bh[i]-c)*t));
    return '#' + rh.map(c=>c.toString(16).padStart(2,'0')).join('');
  }

  function proximityColor(p){
    // p 0..100
    if (p < 50) return lerpColor('#38bdf8', '#fbbf24', p/50);
    return lerpColor('#fbbf24', '#fb7185', (p-50)/50);
  }

  function statusLabel(p){
    if (p >= 97) return 'LOCKED';
    if (p >= 85) return 'BURNING';
    if (p >= 65) return 'HOT';
    if (p >= 45) return 'WARM';
    if (p >= 25) return 'COOL';
    if (p >= 10) return 'COLD';
    return 'FREEZING';
  }

  function addLogEntry(n, guess, prox, way){
    const item = document.createElement('div');
    item.className = 'log-item';
    const color = proximityColor(prox);
    item.innerHTML = `
      <span class="dot" style="background:${color}"></span>
      <span class="n">#${n}</span>
      <span class="v">${fmt(guess)}</span>
      <span class="f">${way} · ${prox}%</span>
    `;
    logList.appendChild(item);
    logList.scrollTop = logList.scrollHeight;
  }

  function submitGuess(){
    const raw = guessInput.value.trim();
    const g = parseInt(raw, 10);
    if (raw === '' || isNaN(g) || g < min || g > max){
      gamePanel.classList.remove('shake');
      void gamePanel.offsetWidth;
      gamePanel.classList.add('shake');
      guessInput.focus();
      return;
    }
    attempts++;
    const dist = Math.abs(g - target);
    const span = max - min || 1;
    const prox = Math.max(0, Math.round((1 - dist / span) * 100));

    meterFill.style.width = prox + '%';
    meterFill.style.background = proximityColor(prox);
    meterStatus.textContent = statusLabel(prox);
    meterStatus.style.color = proximityColor(prox);

    if (g === target){
      addLogEntry(attempts, g, 100, 'LOCK');
      finishGame();
      return;
    }

    const way = g < target ? 'TOO LOW' : 'TOO HIGH';
    directionTag.textContent = way + (g < target ? ' ↑ go higher' : ' ↓ go lower');
    directionTag.className = 'direction-tag show ' + (g < target ? 'low' : 'high');

    addLogEntry(attempts, g, prox, way);
    attemptText.textContent = 'ATTEMPT ' + String(attempts + 1).padStart(2, '0');
    guessInput.value = '';
    guessInput.focus();
  }

  function finishGame(){
    const elapsed = Math.round((Date.now() - startTime) / 1000);
    document.getElementById('winNum').textContent = target;
    document.getElementById('winAttempts').textContent = attempts;
    document.getElementById('winRange').textContent = fmt(max - min + 1);
    document.getElementById('winTime').textContent = elapsed + 's';
    gamePanel.style.display = 'none';
    winPanel.style.display = 'block';
  }

  beginBtn.addEventListener('click', startGame);
  lockBtn.addEventListener('click', submitGuess);
  guessInput.addEventListener('keydown', e => { if (e.key === 'Enter') submitGuess(); });
  document.getElementById('againBtn').addEventListener('click', () => {
    winPanel.style.display = 'none';
    setupPanel.style.display = 'block';
  });
})();
</script>
</body>
</html>
